version: "3.8"

services:

  mysql:
    image: mysql:8.0
    container_name: resumeai-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - resumeai-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: resumeai-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - resumeai-network

  eureka-server:
    image: arvind0017/eureka-server:latest
    container_name: eureka-server
    restart: always
    build:
      context: ./eureka-server
    ports:
      - "8761:8761"
    networks:
      - resumeai-network

  admin-server:
    image: arvind0017/admin-server:latest
    container_name: admin-server
    restart: always
    build:
      context: ./microservices/admin-server
    environment:
      PORT: 9090
      EUREKA_URL: http://eureka-server:8761/eureka/
    ports:
      - "9090:9090"
    depends_on:
      - eureka-server
    networks:
      - resumeai-network

  api-gateway:
    image: arvind0017/api-gateway:latest
    container_name: api-gateway
    restart: always
    build:
      context: ./api-gateway
    environment:
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_URL: ${CLIENT_URL}
      ADMIN_SERVER_URL: http://admin-server:9090
      EUREKA_URL: http://eureka-server:8761/eureka/
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
      - admin-server
    networks:
      - resumeai-network

  auth-service:
    image: arvind0017/auth-service:latest
    container_name: auth-service
    restart: always
    build:
      context: ./microservices/auth-service
    environment:
      PORT: 8081
      ADMIN_SERVER_URL: http://admin-server:9090
      EUREKA_URL: http://eureka-server:8761/eureka/
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      REDIRECT_URI: ${REDIRECT_URI}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_db
    ports:
      - "8081:8081"
    depends_on:
      - mysql
      - rabbitmq
      - eureka-server
      - admin-server
    networks:
      - resumeai-network

  resume-service:
    image: arvind0017/resume-service:latest
    container_name: resume-service
    restart: always
    build:
      context: ./microservices/resume-service
    environment:
      PORT: 8082
      ADMIN_SERVER_URL: http://admin-server:9090
      EUREKA_URL: http://eureka-server:8761/eureka/
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/resume_db
      AUTH_SERVICE_URL: http://auth-service:8081
    ports:
      - "8082:8082"
    depends_on:
      - mysql
      - eureka-server
      - auth-service
    networks:
      - resumeai-network

  ai-service:
    image: arvind0017/ai-service:latest
    container_name: ai-service
    restart: always
    build:
      context: ./microservices/ai-service
    environment:
      PORT: 8084
      ADMIN_SERVER_URL: http://admin-server:9090
      EUREKA_URL: http://eureka-server:8761/eureka/
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ai_db
    ports:
      - "8084:8084"
    depends_on:
      - mysql
      - eureka-server
    networks:
      - resumeai-network

  template-service:
    image: arvind0017/template-service:latest
    container_name: template-service
    restart: always
    build:
      context: ./microservices/template-service
    environment:
      PORT: 8085
      ADMIN_SERVER_URL: http://admin-server:9090
      EUREKA_URL: http://eureka-server:8761/eureka/
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/template_db
    ports:
      - "8085:8085"
    depends_on:
      - mysql
      - eureka-server
    networks:
      - resumeai-network

  payment-service:
    image: arvind0017/payment-service:latest
    container_name: payment-service
    restart: always
    build:
      context: ./microservices/payment-service
    environment:
      PORT: 8086
      ADMIN_SERVER_URL: http://admin-server:9090
      EUREKA_URL: http://eureka-server:8761/eureka/
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CLIENT_ID: ${PAYPAL_CLIENT_ID}
      CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      GATEWAY_URL: ${GATEWAY_URL}
      CLIENT_URL: ${CLIENT_URL}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/payment_db
    ports:
      - "8086:8086"
    depends_on:
      - mysql
      - eureka-server
    networks:
      - resumeai-network

  export-service:
    image: arvind0017/export-service:latest
    container_name: export-service
    restart: always
    build:
      context: ./microservices/export-service
    environment:
      PORT: 8087
      ADMIN_SERVER_URL: http://admin-server:9090
      EUREKA_URL: http://eureka-server:8761/eureka/
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      AWS_REGION: ${AWS_REGION}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/export_db
    ports:
      - "8087:8087"
    depends_on:
      - mysql
      - rabbitmq
      - eureka-server
    networks:
      - resumeai-network

  notification-service:
    image: arvind0017/notification-service:latest
    container_name: notification-service
    restart: always
    build:
      context: ./microservices/notification-service
    environment:
      PORT: 8088
      ADMIN_SERVER_URL: http://admin-server:9090
      EUREKA_URL: http://eureka-server:8761/eureka/
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    ports:
      - "8088:8088"
    depends_on:
      - rabbitmq
      - eureka-server
    networks:
      - resumeai-network

volumes:
  mysql_data:

networks:
  resumeai-network:
    driver: bridge