# 1. Basic App Info
spring:
  application:
    name: PAYMENT-SERVICE

  datasource:
    url: jdbc:mysql://localhost:3306/payment_db
    username: resumeai
    password: resumeai
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

server:
  port: ${PORT:8086}

paypal:
  client-id: ${CLIENT_ID}
  client-secret: ${CLIENT_SECRET}
  mode: sandbox

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# Payment Service Configuration
app:
  gateway-url: ${GATEWAY_URL:http://localhost:8080}
  client-url: ${CLIENT_URL:http://localhost:4200}
  endpoints:
    success-path: /api/v1/payments/pay/success
    cancel-path: /api/v1/payments/pay/cancel
    frontend-success-path: /payment-success
    frontend-failed-path: /payment-failed

# Swagger/OpenAPI Configuration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs

  boot:
    admin:
      client:
        url: ${ADMIN_SERVER_URL:http://localhost:9090}
        instance:
          prefer-ip: true
