server:
  port: ${PORT:8084}

spring:
  application:
    name: AI-SERVICE

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ai_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  jackson:
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  boot:
    admin:
      client:
        url: ${ADMIN_SERVER_URL:http://localhost:9090}
        instance:
          prefer-ip: true

# AI Provider Configuration
ai:
  provider:
    gemini:
      api-key: ${GEMINI_API_KEY}
      model: gemini-2.5-flash
      max-tokens: 2048
    quota:
      free-tier-monthly-limit: 5
      premium-monthly-limit: 500

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    enabled: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    operationsSorter: alpha
    tagsSorter: alpha
  api-docs:
    path: /api-docs
