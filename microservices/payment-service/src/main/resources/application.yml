# 1. Basic App Info
spring:
  application:
    name: PAYMENT-SERVICE

server:
  port: ${PORT:8086}

paypal:
  client-id: ${CLIENT_ID}
  client-secret: ${CLIENT_SECRET}
  mode: sandbox

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true